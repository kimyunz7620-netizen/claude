<title>정부지원 체크</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* layout: one narrow column; 내 조건 form on top, summary strip, then programs grouped by what to do (챙기기 / 확인하기 / 해당 안 됨 / 결혼 때) */
:root{
  --bg:#F2F3EF;--card:#FFFFFF;--ink:#1B2432;--muted:#5C6676;--line:#DBDFD7;--accent:#1D5468;--accent-soft:#E1EEF2;
  --ok:#1E7A4B;--ok-soft:#E1F1E8;--warn:#9A6200;--warn-soft:#FBF0D8;--no:#6F7886;--no-soft:#E8EAEC;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;--f-num:"Noto Serif KR","Nanum Myeongjo",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171E;--card:#1A212B;--ink:#E7EBF0;--muted:#9AA5B4;--line:#2A3340;--accent:#86C6D8;--accent-soft:#1C2E36;
  --ok:#5CC48D;--ok-soft:#18302A;--warn:#E3B24D;--warn-soft:#33290F;--no:#8793A3;--no-soft:#232A34;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171E;--card:#1A212B;--ink:#E7EBF0;--muted:#9AA5B4;--line:#2A3340;--accent:#86C6D8;--accent-soft:#1C2E36;
  --ok:#5CC48D;--ok-soft:#18302A;--warn:#E3B24D;--warn-soft:#33290F;--no:#8793A3;--no-soft:#232A34;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0;
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:1.5rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:.78rem;margin:0;letter-spacing:.06em;color:var(--muted);font-weight:600}
.sub{color:var(--muted);font-size:.86rem;margin:4px 0 0}
.tiny{font-size:.78rem;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field span{font-size:.78rem;color:var(--muted);font-weight:500}
.field input,.field select{font:inherit;font-size:.95rem;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
.field input:focus-visible,.field select:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:.84rem;margin-top:12px}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.sum b{font-family:var(--f-num);font-size:1.6rem;line-height:1.1}
.sum small{color:var(--muted);font-size:.78rem}
.sum .ok b{color:var(--ok)}.sum .check b{color:var(--warn)}.sum .no b{color:var(--no)}
.total{display:flex;flex-direction:column;gap:2px;background:var(--accent-soft);border-radius:14px;padding:14px 16px}
.total b{font-family:var(--f-num);font-size:1.7rem;color:var(--accent);line-height:1.15}
.group{display:flex;flex-direction:column;gap:10px}
.prog{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.prog summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:14px 16px;align-items:start}
.prog summary::-webkit-details-marker{display:none}
.prog .name{font-weight:600;font-size:1rem;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.prog .gain{font-family:var(--f-num);font-weight:700;font-size:1.05rem;text-align:right;white-space:nowrap}
.prog .gain small{display:block;font-family:var(--f-body);font-weight:400;font-size:.74rem;color:var(--muted)}
.prog .one{grid-column:1 / -1;color:var(--muted);font-size:.86rem}
.stamp{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em;border:1.5px solid currentColor}
.stamp.ok{color:var(--ok);background:var(--ok-soft)}.stamp.check{color:var(--warn);background:var(--warn-soft)}.stamp.no{color:var(--no);background:var(--no-soft)}.stamp.later{color:var(--accent);background:var(--accent-soft)}
.body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.conds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.conds li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;font-size:.88rem}
.conds i{font-style:normal;font-weight:700;text-align:center}
.conds .y i{color:var(--ok)}.conds .n i{color:var(--no)}.conds .q i{color:var(--warn)}
.how{font-size:.88rem}
.how b{font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-size:.8rem;padding:7px 11px;background:transparent;border:0;color:var(--muted);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--card);font-weight:600}
.link{color:var(--accent);font-size:.86rem;font-weight:600;text-decoration:none;border-bottom:1px solid currentColor}
.src{font-size:.78rem;color:var(--muted);line-height:1.6}
.empty{color:var(--muted);font-size:.9rem}
@media (max-width:420px){.fields{grid-template-columns:1fr}.sum b{font-size:1.4rem}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>정부지원 체크</h1>
    <p class="sub">내 조건으로 받을 수 있는 지원과 세금 혜택을 확인해요 · 2026년 10월 기준</p>
  </header>

  <section class="card" aria-labelledby="hProfile">
    <h2 id="hProfile">내 조건</h2>
    <div class="fields" style="margin-top:10px">
      <label class="field"><span>만 나이</span><input id="pAge" type="number" inputmode="numeric" min="15" max="70"></label>
      <label class="field"><span>총급여 (세전 연봉, 원)</span><input id="pPay" type="text" inputmode="numeric"></label>
      <label class="field"><span>월세 (원)</span><input id="pRent" type="text" inputmode="numeric"></label>
      <label class="field"><span>무주택 세대주</span><select id="pHome"><option value="y">예</option><option value="n">아니오</option></select></label>
      <label class="field"><span>중소기업 재직</span><select id="pSme"><option value="?">모르겠어요</option><option value="y">예</option><option value="n">아니오</option></select></label>
      <label class="field"><span>올해 연금저축 납입액 (원)</span><input id="pPen" type="text" inputmode="numeric"></label>
      <label class="field"><span>월 대중교통비 (원)</span><input id="pTr" type="text" inputmode="numeric"></label>
      <label class="field"><span>월 실수령 (원)</span><input id="pNet" type="text" inputmode="numeric"></label>
    </div>
    <p class="note" id="defNote">처음 보이는 숫자는 가계부에서 가져온 대략값이에요. 나이와 총급여는 실제 값으로 고치면 아래가 바로 다시 계산돼요.</p>
  </section>

  <section class="sum" id="sum" aria-label="요약"></section>
  <section class="total" id="total"></section>

  <div id="groups" class="group"></div>

  <footer class="src" id="src">
    수치는 공개된 안내와 기사를 모아 정리한 거라 일부 소득 기준은 출처마다 달라요. '확인' 표시가 붙은 항목은 신청 전에 공식 사이트에서 한 번 더 보세요.
  </footer>
</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var won=function(n){return (Math.round(n)||0).toLocaleString("ko-KR")+"원"};
var parse=function(v){return Number(String(v||"").replace(/[^\d]/g,""))||0};
var fmt=function(n){return n?Math.round(n).toLocaleString("ko-KR"):""};
/* defaults come from the budget app: 월 실수령 399만, 월세 69.9만, 교통 3만, 올해 연금저축 15만 */
var DEF={age:33,pay:57000000,rent:699000,home:"y",sme:"?",pen:150000,tr:30000,net:3990000};
var profile=Object.assign({},DEF),state={},db=null,saveT=null,edited=false;

/* ---- programs: evaluate(profile) -> {status, gain, gainNote, conds:[{t,v:'y'|'n'|'q'}]} ---- */
var P=[
 {id:"rent",name:"월세 세액공제",group:"take",
  one:"월세를 낸 만큼 연말정산에서 세금으로 돌려받아요",
  ev:function(p){
    var c=[{t:"무주택 세대주",v:p.home==="y"?"y":"n"},{t:"총급여 8,000만 원 이하",v:p.pay<=80000000?"y":"n"},{t:"월세를 내고 있음",v:p.rent>0?"y":"n"}];
    var no=c.some(function(x){return x.v==="n"}),rate=p.pay<=55000000?0.17:0.15,base=Math.min(p.rent*12,10000000);
    c.push({t:"전용 85㎡ 이하이거나 기준시가 4억 원 이하, 임대차계약서와 주민등록 주소가 같음",v:"q"});
    return {status:no?"no":"ok",gain:no?0:base*rate,unit:"연 환급",gainNote:"월세 "+won(p.rent*12)+" × "+Math.round(rate*1000)/10+"% (한도 연 1,000만 원)",conds:c,
      how:"<b>연말정산 때</b> 회사에 임대차계약서 사본, 주민등록등본, 월세 이체 내역을 내요. 지난해 이전에 놓쳤어도 5년 안이면 경정청구로 돌려받을 수 있어요.",
      links:[["홈택스 연말정산","https://www.hometax.go.kr"]]}}},
 {id:"pension",name:"연금저축·IRP 세액공제",group:"take",
  one:"연금저축에 넣은 돈의 13.2~16.5%를 세금에서 돌려받아요 · 지금 하고 있어요",
  ev:function(p){
    var rate=p.pay<=55000000?0.165:0.132,used=Math.min(p.pen,6000000);
    return {status:"ok",gain:used*rate,unit:"올해 환급",gainNote:"올해 "+won(p.pen)+" 납입 × "+Math.round(rate*1000)/10+"%",
      conds:[{t:"근로소득이 있음",v:"y"},{t:"연금저축 연 600만 원까지 공제 (IRP 합쳐 900만 원)",v:"y"},{t:"지금 한도의 "+Math.round(used/6000000*100)+"%만 쓰고 있어요. 한도까지 넣으면 연 최대 "+won(6000000*rate),v:"q"}],
      how:"가계부 계획은 2027년 8월 월 20만 원, 2028년 6월부터 월 30만 원이에요. 대출이 끝나는 2027년 7월 이후 한도까지 늘리는 걸 다시 볼 수 있어요.",
      links:[["홈택스 연말정산","https://www.hometax.go.kr"]]}}},
 {id:"future",name:"청년미래적금",group:"take",
  one:"3년 동안 넣으면 정부기여금 6%와 이자를 더해 받아요 · 하나은행 개설 예정",
  ev:function(p){
    var age=p.age>=19&&p.age<=34,c=[{t:"만 19~34세",v:age?"y":"n"}],pay=p.pay;
    var inc=pay<=60000000?"y":pay<=75000000?"q":"n";
    c.push({t:"총급여 기준 (출처에 따라 6,000만 원 또는 7,500만 원 이하)",v:inc});
    c.push({t:"금융소득종합과세 대상이 아님",v:"y"});
    var no=c.some(function(x){return x.v==="n"}),chk=c.some(function(x){return x.v==="q"});
    return {status:no?"no":chk?"check":"ok",gain:no?0:2550000,unit:"3년 합계",gainNote:"월 10만 원 2개월 + 월 50만 원 34개월 기준 · 기여금 약 103만 원 + 이자 약 152만 원",conds:c,
      how:"가계부에는 2026년 11월 시작, 2027년 1월부터 월 50만 원으로 넣어 있어요. 중도해지하면 정부기여금을 못 받아요.",
      links:[["금융위원회","https://www.fsc.go.kr"]]}}},
 {id:"house-ded",name:"청약저축 소득공제",group:"take",
  one:"주택청약종합저축 납입액의 40%를 소득에서 빼 줘요",
  ev:function(p){
    var c=[{t:"무주택 세대주",v:p.home==="y"?"y":"n"},{t:"총급여 7,000만 원 이하",v:p.pay<=70000000?"y":"n"},{t:"주택청약종합저축 납입 중 (월 2만 원)",v:"y"}];
    var no=c.some(function(x){return x.v==="n"}),ded=Math.min(240000,3000000)*0.4,rate=0.165;
    return {status:no?"no":"ok",gain:no?0:ded*rate,unit:"연 환급",gainNote:"공제 "+won(ded)+" × 세율 약 "+Math.round(rate*1000)/10+"%",conds:c,
      how:"은행에서 <b>무주택확인서</b>를 받아 다음 해 회사에 내요. 납입 한도는 연 300만 원이에요.",
      links:[["청약홈","https://www.applyhome.co.kr"]]}}},
 {id:"kpass",name:"K-패스 대중교통 환급",group:"take",
  one:"한 달 15번 이상 타면 청년은 쓴 돈의 30%를 돌려받아요",
  ev:function(p){
    var young=p.age>=19&&p.age<=34,r=young?0.30:0.20;
    return {status:p.tr>0?"ok":"no",gain:p.tr*12*r,unit:"연 환급",gainNote:"월 "+won(p.tr)+" × "+Math.round(r*100)+"%",
      conds:[{t:"K-패스 카드를 쓰고 있음",v:"q"},{t:"한 달 15번 이상 대중교통 이용",v:"q"},{t:young?"청년(만 19~34세) 30%":"일반 20%",v:"y"}],
      how:"K-패스 카드를 발급받아 등록하면 다음 달에 돌아와요. 교통비가 적어도 신청해 두면 손해는 없어요.",
      links:[["K-패스","https://korea-pass.kr"]]}}},
 {id:"sme",name:"중소기업 취업 청년 소득세 감면",group:"check",
  one:"중소기업에 다니는 청년은 소득세의 90%를 5년간 깎아 줘요",
  ev:function(p){
    var age=p.age<=34?"y":"q",sme=p.sme==="y"?"y":p.sme==="n"?"n":"q";
    var c=[{t:"만 15~34세 (군 복무 기간은 나이에서 뺄 수 있어요)",v:age},{t:"중소기업 재직",v:sme},{t:"감면 대상 업종 (제조·도소매 등, 금융·전문서비스는 제외)",v:"q"},{t:"감면 기간 5년 이내, 적용 시한 확인 필요",v:"q"}];
    var no=sme==="n";
    return {status:no?"no":sme==="y"?"check":"check",gain:no?0:2000000,unit:"연 최대",gainNote:"소득세 90% 감면, 과세기간별 한도 200만 원",conds:c,count:false,
      how:"회사가 중소기업이면 총무·인사팀에 <b>감면신청서</b>를 내요. 이미 지나간 해는 경정청구로 돌려받을 수 있어요. 해당하면 가장 큰 항목이에요.",
      links:[["홈택스","https://www.hometax.go.kr"]]}}},
 {id:"dream",name:"청년 주택드림 청약통장",group:"check",
  one:"일반 청약통장보다 금리가 높고 당첨 시 낮은 금리로 대출받아요",
  ev:function(p){
    var c=[{t:"만 19~34세",v:(p.age>=19&&p.age<=34)?"y":"n"},{t:"무주택",v:p.home==="y"?"y":"n"},{t:"연소득 5,000만 원 이하 (확대 여부 확인 중)",v:p.pay<=50000000?"y":"q"}];
    var no=c.some(function(x){return x.v==="n"});
    return {status:no?"no":c[2].v==="y"?"ok":"check",gain:0,unit:"",gainNote:"월 2만 원 납입으로는 이자 차이가 작고, 당첨 때 대출 금리 혜택이 커요",conds:c,
      how:"연소득 기준이 5,000만 원을 넘는 청년도 되는지 <b>10월 27일에 은행에서 확인</b>하기로 했어요. 기존 청약통장에서 갈아타면 가입 기간이 이어져요.",
      links:[["청약홈","https://www.applyhome.co.kr"]]}}},
 {id:"youth-rent",name:"청년월세 지원",group:"no",
  one:"월 최대 20만 원을 최대 24개월 받아요",
  ev:function(p){
    var lim=1540000,ok=p.net<=lim;
    return {status:ok?"check":"no",gain:0,unit:"",gainNote:"",
      conds:[{t:"청년가구 소득이 기준 중위소득 60% 이하 (1인 월 약 154만 원)",v:ok?"y":"n"},{t:"보증금 5,000만 원 이하, 월세 60만 원 이하",v:p.rent<=600000?"y":"n"},{t:"부모 가구도 소득·재산 기준을 같이 봐요",v:"q"}],
      how:"월 실수령이 기준을 넘으면 해당 안 돼요. 소득이 크게 줄거나 지자체 별도 사업이 있으면 다시 보세요.",
      links:[["복지로","https://www.bokjiro.go.kr"]]}}},
 {id:"eitc",name:"근로장려금",group:"no",one:"소득이 낮은 근로자에게 현금을 줘요",
  ev:function(p){return {status:"no",gain:0,unit:"",gainNote:"",conds:[{t:"단독 가구 총소득 2,200만 원 미만",v:p.pay<22000000?"y":"n"}],how:"소득이 기준을 훨씬 넘어요.",links:[["홈택스","https://www.hometax.go.kr"]]}}},
 {id:"saving-acc",name:"청년내일저축계좌",group:"no",one:"저소득 청년이 저축하면 정부가 같은 금액을 더 넣어 줘요",
  ev:function(p){return {status:"no",gain:0,unit:"",gainNote:"",conds:[{t:"가구 소득이 기준 중위소득 이하 (확인 필요)",v:p.net<=2560000?"q":"n"}],how:"월 소득이 기준을 넘어서 해당 안 돼요.",links:[["복지로","https://www.bokjiro.go.kr"]]}}},
 {id:"wedding",name:"결혼 때 볼 것 (2028년 5월)",group:"later",
  one:"신혼부부 청약, 대출, 세금 혜택이 한꺼번에 바뀌어요",
  ev:function(p){return {status:"later",gain:0,unit:"",gainNote:"",
    conds:[{t:"혼인 세액공제는 2026년 말까지 혼인신고한 경우에 한해요. 2028년분은 연장 여부 확인",v:"q"},{t:"신혼부부 주택 특별공급: 혼인 기간과 소득 기준",v:"q"},{t:"신혼부부 전용 구입·전세자금 대출과 금리 우대",v:"q"},{t:"청년미래적금은 만기(2029년 11월)보다 일찍 쓰면 기여금을 잃어요",v:"q"}],
    how:"결혼 6개월 전쯤 청약홈과 주택도시기금에서 소득 기준과 혼인 기간 조건을 확인해요.",
    links:[["청약홈","https://www.applyhome.co.kr"],["주택도시기금","https://nhuf.molit.go.kr"]]}}},
 {id:"local",name:"내 지역 청년 사업",group:"later",
  one:"사는 곳에 따라 월세, 교통, 문화 지원이 따로 있어요",
  ev:function(p){return {status:"later",gain:0,unit:"",gainNote:"",
    conds:[{t:"온통청년에서 나이·지역·관심 분야로 검색",v:"q"},{t:"구청과 시·도 청년 포털의 공고 확인",v:"q"}],
    how:"지자체 사업은 공고 기간이 짧아요. 분기마다 한 번씩 검색해 두면 놓치지 않아요.",
    links:[["온통청년","https://www.youthcenter.go.kr"]]}}}
];
var GROUPS=[["take","바로 챙길 것"],["check","확인이 필요한 것"],["no","지금은 해당 안 되는 것"],["later","나중에 볼 것"]];
var LABEL={ok:"해당",check:"확인",no:"제외",later:"예정"};

function readForm(){
  var p={age:parse($("pAge").value),pay:parse($("pPay").value),rent:parse($("pRent").value),home:$("pHome").value,sme:$("pSme").value,pen:parse($("pPen").value),tr:parse($("pTr").value),net:parse($("pNet").value)};
  return p;
}
function writeForm(p){
  if(document.activeElement!==$("pAge"))$("pAge").value=p.age||"";
  var map={pPay:"pay",pRent:"rent",pPen:"pen",pTr:"tr",pNet:"net"};
  Object.keys(map).forEach(function(id){if(document.activeElement!==$(id))$(id).value=fmt(p[map[id]])});
  $("pHome").value=p.home;$("pSme").value=p.sme;
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}

function render(){
  var res=P.map(function(pr){var r=pr.ev(profile);r.pr=pr;return r});
  var groups={take:[],check:[],no:[],later:[]};
  res.forEach(function(r){
    var g=r.status==="no"?"no":r.status==="later"?"later":(r.status==="check"?"check":"take");
    if(r.pr.group==="check"&&r.status==="ok")g="take";
    groups[g].push(r);
  });
  var okN=groups.take.length,chkN=groups.check.length,noN=groups.no.length;
  $("sum").innerHTML='<div class="ok"><b>'+okN+'</b><small>바로 챙길 것</small></div><div class="check"><b>'+chkN+'</b><small>확인할 것</small></div><div class="no"><b>'+noN+'</b><small>해당 안 됨</small></div>';
  var yearly=groups.take.filter(function(r){return r.unit&&r.unit!=="3년 합계"}).reduce(function(a,r){return a+r.gain},0);
  var fut=res.filter(function(r){return r.pr.id==="future"&&r.status!=="no"})[0];
  var sme=res.filter(function(r){return r.pr.id==="sme"&&r.status!=="no"})[0];
  $("total").innerHTML='<span class="tiny">1년에 돌려받거나 아끼는 돈 (해당 항목 합계)</span><b class="num">'+won(yearly)+'</b>'
    +'<span class="tiny">'+(fut?"청년미래적금은 3년 합계 약 "+won(fut.gain)+" 별도 · ":"")+(sme?"중소기업 소득세 감면에 해당하면 연 최대 "+won(sme.gain)+" 더 · ":"")+'월세 세액공제를 아직 안 받았다면 지난 5년분도 청구할 수 있어요</span>';
  var html="";
  GROUPS.forEach(function(g){
    var list=groups[g[0]];if(!list.length)return;
    html+='<section class="group" aria-label="'+esc(g[1])+'"><h2>'+esc(g[1])+' · '+list.length+'</h2>';
    list.sort(function(a,b){return (b.gain||0)-(a.gain||0)}).forEach(function(r){html+=card(r)});
    html+='</section>';
  });
  var open={};document.querySelectorAll("details.prog[open]").forEach(function(d){open[d.dataset.id]=1});
  $("groups").innerHTML=html;
  document.querySelectorAll("details.prog").forEach(function(d){if(open[d.dataset.id])d.open=true});
}
function card(r){
  var pr=r.pr,st=state[pr.id]||"";
  var gain=r.gain?'<div class="gain num">'+won(r.gain)+'<small>'+esc(r.unit)+'</small></div>':'<div class="gain"></div>';
  var conds=r.conds.map(function(c){var m={y:"✓",n:"✕",q:"?"}[c.v];return '<li class="'+c.v+'"><i aria-hidden="true">'+m+'</i><span>'+esc(c.t)+'</span></li>'}).join("");
  var links=r.links.map(function(l){return '<a class="link" href="'+esc(l[1])+'" target="_blank" rel="noopener">'+esc(l[0])+' ↗</a>'}).join(" ");
  var seg=["할 일","신청함","끝냄"].map(function(s){return '<button type="button" data-prog="'+pr.id+'" data-st="'+s+'" aria-pressed="'+(st===s)+'">'+s+'</button>'}).join("");
  return '<details class="prog" data-id="'+pr.id+'"><summary><div class="name">'+esc(pr.name)+' <span class="stamp '+r.status+'">'+LABEL[r.status]+'</span></div>'+gain+'<div class="one">'+esc(pr.one)+(r.gainNote?' · '+esc(r.gainNote):'')+'</div></summary>'
    +'<div class="body"><ul class="conds">'+conds+'</ul><div class="how">'+r.how+'</div><div class="row"><div>'+links+'</div>'+(r.status==="no"?'':'<div class="seg" role="group" aria-label="진행 상태">'+seg+'</div>')+'</div></div></details>';
}

/* ---- persistence: db when available, localStorage as a convenience fallback ---- */
function lsGet(k){try{var v=localStorage.getItem("gov:"+k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem("gov:"+k,JSON.stringify(v))}catch(e){}}
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(function(){
    lsSet("profile",profile);lsSet("state",state);
    if(db){db.doc("gov/profile").set(Object.assign({},profile,{edited:true})).catch(function(){});db.doc("gov/state").set(state).catch(function(){})}
  },400);
}
function onForm(){profile=readForm();edited=true;$("defNote").hidden=true;render();save()}
["pAge","pPay","pRent","pPen","pTr","pNet"].forEach(function(id){$(id).addEventListener("input",onForm)});
["pHome","pSme"].forEach(function(id){$(id).addEventListener("change",onForm)});
["pPay","pRent","pPen","pTr","pNet"].forEach(function(id){$(id).addEventListener("blur",function(){$(id).value=fmt(parse($(id).value))})});
$("groups").addEventListener("click",function(e){
  var b=e.target.closest("button[data-prog]");if(!b)return;
  var id=b.dataset.prog,v=b.dataset.st;state[id]=state[id]===v?"":v;
  document.querySelectorAll('button[data-prog="'+id+'"]').forEach(function(x){x.setAttribute("aria-pressed",String(state[id]===x.dataset.st))});
  save();
});

var local=lsGet("profile");if(local){profile=Object.assign({},DEF,local);edited=true}
var ls=lsGet("state");if(ls)state=ls;
$("defNote").hidden=edited;writeForm(profile);render();
(async function(){
  try{
    var c=window.claude&&window.claude.use?await window.claude.use("db"):null;if(!c)return;db=c;
    db.doc("gov/profile").onSnapshot(function(s){if(s.exists){var d=s.data()||{};profile=Object.assign({},DEF,d);$("defNote").hidden=!!d.edited;writeForm(profile);render()}},function(){});
    db.doc("gov/state").onSnapshot(function(s){if(s.exists){state=s.data()||{};render()}},function(){});
  }catch(e){}
})();
})();
</script>
